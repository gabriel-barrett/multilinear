[package]
name = "multilinear"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1"
ark-crypto-primitives = { version = "0.5", features = ["merkle_tree"] }
ark-ff = { version = "0.5", features = ["asm", "std"] }
ark-poly = "0.5"
ark-serialize = "0.5"
ark-std = { version = "0.5", features = ["std"] }
bincode = { version = "2.0.0", features = ["serde", "alloc"] }
blake3 = "1.5.0"
clap = { version = "4.4.17", features = ["derive"] }
derive_more = { version = "2.0.1", features = ["full"] }
itertools = "0.14"
rand = { version = "0.9.0", default-features = false, features = ["small_rng", "thread_rng"] }
rayon = { version = "1.10.0", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.10"
spongefish = { git = "https://github.com/arkworks-rs/spongefish", features = ["arkworks-algebra"] }
spongefish-pow = { git = "https://github.com/arkworks-rs/spongefish" }
thiserror = "2.0"
tracing = { version = "0.1.41", optional = true }

whir = { path = "whir" }

p3-air = { path = "Plonky3/air" }
p3-challenger = { path = "Plonky3/challenger" }
p3-commit = { path = "Plonky3/commit" }
p3-dft = { path = "Plonky3/dft" }
p3-field = { path = "Plonky3/field" }
p3-fri = { path = "Plonky3/fri" }
p3-goldilocks = { path = "Plonky3/goldilocks" }
p3-baby-bear = { path = "Plonky3/baby-bear" }
p3-koala-bear = { path = "Plonky3/koala-bear" }
p3-matrix = { path = "Plonky3/matrix" }
p3-maybe-rayon = { path = "Plonky3/maybe-rayon" }
p3-mds = { path = "Plonky3/mds" }
p3-merkle-tree = { path = "Plonky3/merkle-tree" }
p3-poseidon2 = { path = "Plonky3/poseidon2" }
p3-symmetric = { path = "Plonky3/symmetric" }
p3-uni-stark = { path = "Plonky3/uni-stark" }
p3-util = { path = "Plonky3/util" }

[features]
parallel = ["p3-maybe-rayon/parallel", "p3-uni-stark/parallel"]